<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background: #f7f5ef; font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: rgba(10, 10, 10, 0.15); stroke-width: 1.5; }
      .badge-yellow { fill: #ffd21f; }
      .badge-ink { fill: #0a0a0a; }
      .text-title { font-family: 'Bricolage Grotesque', 'Archivo', sans-serif; font-weight: 800; font-size: 18px; fill: #0a0a0a; letter-spacing: -0.02em; }
      .text-sub { font-size: 11px; fill: #595959; line-height: 1.4; }
      .text-code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #0a0a0a; }
      .text-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; fill: #595959; }
      .line { stroke: #0a0a0a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Top Category Bar -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="130" height="20" rx="2" class="badge-ink" />
    <text x="8" y="14" font-size="9px" font-weight="700" fill="#ffd21f" letter-spacing="0.1em">CLINICAL NLP PIPELINE</text>
    <text x="140" y="14" class="text-tag">SPEECH-TO-TEXT · FACT EXTRACTION · SCHEMA CHECKS</text>
  </g>

  <!-- Main Card Container -->
  <g transform="translate(40, 68)">
    <rect x="0" y="0" width="720" height="395" rx="6" class="card" />

    <!-- Waveform Input -->
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="320" height="60" rx="4" fill="#faf9f5" stroke="rgba(10,10,10,0.1)" />
      <path d="M 15 30 Q 25 10, 35 30 T 55 30 T 75 8 T 95 45 T 115 15 T 135 40 T 155 30 T 175 30 T 195 5 T 215 50 T 235 20 T 255 38 T 275 30 T 295 30" fill="none" stroke="#0a0a0a" stroke-width="2" />
      <rect x="12" y="8" width="85" height="14" rx="2" class="badge-yellow" />
      <text x="16" y="18" font-size="8px" font-weight="700" fill="#0a0a0a">AUDIO INPUT</text>
      <text x="210" y="18" class="text-tag" font-size="8px">MALAYALAM + EN</text>
    </g>

    <!-- Schema Validation & Entity Guardrail -->
    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="320" height="150" rx="4" fill="#faf9f5" stroke="rgba(10,10,10,0.12)" />
      <rect x="14" y="14" width="125" height="16" rx="2" class="badge-ink" />
      <text x="19" y="25" font-size="8px" font-weight="700" fill="#ffffff">DETERMINISTIC CHECKS</text>
      
      <text x="14" y="52" class="text-code" font-weight="600">✓ Strict JSON Schema (Zod / Pydantic)</text>
      <text x="14" y="72" class="text-code">✓ Medication Name &amp; Dosage Parsing</text>
      <text x="14" y="92" class="text-code">✓ Negation Boundary ("denies chest pain")</text>
      <text x="14" y="112" class="text-code">✓ Historical vs Current Condition Tagging</text>
      <text x="14" y="132" class="text-code">⚠ Ambiguity Warning: 0 Contradictions</text>
    </g>

    <!-- Clinician Sign-Off Box -->
    <g transform="translate(30, 275)">
      <rect x="0" y="0" width="320" height="92" rx="4" fill="#ffffff" stroke="#ffd21f" stroke-width="2" />
      <rect x="14" y="12" width="130" height="16" rx="2" class="badge-yellow" />
      <text x="18" y="24" font-size="8px" font-weight="800" fill="#0a0a0a">CLINICIAN APPROVAL REQ.</text>
      <text x="14" y="48" class="text-sub" font-weight="600" fill="#0a0a0a">Human-in-the-loop review boundary</text>
      <text x="14" y="66" class="text-sub">Valid schema ≠ clinical truth. Provider sign-off</text>
      <text x="14" y="80" class="text-sub">required before clinical note commit.</text>
    </g>

    <!-- Right Side: Structured Note Output (SOAP format) -->
    <g transform="translate(380, 25)">
      <rect x="0" y="0" width="310" height="342" rx="4" fill="#ffffff" stroke="rgba(10,10,10,0.18)" />
      
      <!-- Top Title -->
      <rect x="0" y="0" width="310" height="32" rx="4" fill="#f0eee6" />
      <text x="14" y="20" class="text-tag" fill="#0a0a0a">STRUCTURED CLINICAL NOTE · SOAP</text>
      <rect x="235" y="8" width="60" height="16" rx="2" fill="#22863a" />
      <text x="242" y="19" font-size="8px" font-weight="700" fill="#ffffff">VALIDATED</text>

      <!-- SOAP Content -->
      <g transform="translate(14, 46)">
        <text x="0" y="14" class="text-code" font-weight="700" fill="#0a0a0a">[S] SUBJECTIVE:</text>
        <text x="0" y="30" class="text-code" fill="#595959">Chief Complaint: Recurrent headache × 3 days.</text>
        <text x="0" y="44" class="text-code" fill="#595959">Associated: Mild photophobia. Denies nausea.</text>

        <text x="0" y="74" class="text-code" font-weight="700" fill="#0a0a0a">[O] OBJECTIVE:</text>
        <text x="0" y="90" class="text-code" fill="#595959">BP: 124/82 mmHg | HR: 74 bpm | SpO2: 98%</text>
        <text x="0" y="104" class="text-code" fill="#595959">Neuro: Cranial nerves II-XII intact.</text>

        <text x="0" y="134" class="text-code" font-weight="700" fill="#0a0a0a">[A] ASSESSMENT:</text>
        <text x="0" y="150" class="text-code" fill="#595959">Tension-type headache vs migraine variant.</text>

        <text x="0" y="180" class="text-code" font-weight="700" fill="#0a0a0a">[P] PLAN &amp; RX:</text>
        <text x="0" y="196" class="text-code" fill="#595959">1. Paracetamol 500mg PO PRN q6h (max 2g/d)</text>
        <text x="0" y="210" class="text-code" fill="#595959">2. Hydration counseling, sleep hygiene</text>
        <text x="0" y="224" class="text-code" fill="#595959">3. Return precautions for focal deficits</text>

        <rect x="0" y="244" width="280" height="34" rx="2" fill="#faf9f5" stroke="rgba(10,10,10,0.1)" />
        <text x="8" y="258" class="text-tag" font-size="8px">TEST EVIDENCE</text>
        <text x="8" y="271" class="text-code" font-size="9px">Synthetically verified dataset · 0 PHI</text>
      </g>
    </g>
  </g>
</svg>
