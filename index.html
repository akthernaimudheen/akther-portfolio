    <!-- Persistent: never carries data-static-seo, so Seo.tsx leaves these alone. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Defaults for the initial document, so link scrapers that never execute
      JavaScript still get a usable preview. Every tag below is marked
      data-static-seo: src/components/Seo.tsx renders the real per-route title,
      description, Open Graph and Twitter tags and removes this static set once
      the app has mounted, which keeps exactly one of each tag in the live DOM.
      The canonical and og:url below are the homepage's, which is the only
      route a scraper can reach without executing JavaScript; Seo.tsx replaces
      them with the real per-route values once the app mounts.
    -->
    <meta
      data-static-seo
      name="description"
      content="Software engineering projects, applied AI systems, technical architecture writing, and web development services by Akther Naimudheen."
    />
    <title data-static-seo>Akther Naimudheen | Software Developer &amp; AI Application Engineer</title>
    <meta data-static-seo property="og:title" content="Akther Naimudheen | Software Developer &amp; AI Application Engineer" />
    <meta
      data-static-seo
      property="og:description"

    <style>
