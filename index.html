<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090b" />
    <meta
      name="description"
      content="Portfolio of Akther V N, a web developer and digital marketing professional based in Thrissur, Kerala."
    />
    <title>Akther V N — Digital Experiences</title>
    <style>
      .direct-open-message { display: none; }
      body.direct-open { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08090b; color: #f7f7f3; font-family: Arial, sans-serif; }
      body.direct-open .skip-link { display: none; }
      body.direct-open .direct-open-message { display: block; width: min(560px, calc(100vw - 32px)); padding: 36px; border: 1px solid #34363d; border-radius: 24px; background: #111318; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
      .direct-open-message span { color: #d8ff00; font-size: 12px; font-weight: 800; letter-spacing: .15em; }
      .direct-open-message h1 { margin: 14px 0 12px; font-size: clamp(32px, 7vw, 54px); line-height: .95; letter-spacing: -.05em; }
      .direct-open-message p { margin: 0; color: #b5b8c0; font-size: 17px; line-height: 1.65; }
      .direct-open-message strong { color: #fff; }
    </style>
  </head>
  <body>
    <script>
      if (window.location.protocol === 'file:') document.body.classList.add('direct-open');
    </script>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="root">
      <main class="direct-open-message">
        <span>ONE QUICK STEP</span>
        <h1>Open the portfolio with its launcher.</h1>
        <p>Close this tab, return to the portfolio folder and double-click <strong>Start Portfolio.cmd</strong>. The launcher starts the local 3D website and opens it automatically.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
